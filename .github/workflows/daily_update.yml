name: Daily Financial Data Incremental Update

on:
  schedule:
    # Se ejecuta de lunes a viernes a las 22:00 UTC (al cierre de los mercados principales)
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando quieras

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install yfinance pandas pyarrow

      - name: Ejecutar script de actualización incremental
        run: |
          python3 CollectorAgent/src/update_daily_incremental.py

      - name: Commitear y pushear cambios al repositorio
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add CollectorAgent/data/parquet/financial_data.parquet
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: actualización incremental diaria de precios [skip ci]" && git push)
          
